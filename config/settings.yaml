    - dall-e
    - "dall·e"
    - midjourney
    - stable diffusion
    - firefly
    - imagen
    - novelai
    - comfyui
    - automatic1111
    - invokeai
    - leonardo
    - ideogram
    - flux
    - sora
    - runway

logging:
  level: INFO

redis:
  url: redis://127.0.0.1:6379/0
  cache_ttl_seconds: 2592000
  lock_ttl_seconds: 60
  lock_wait_seconds: 5
  lock_poll_seconds: 0.2
