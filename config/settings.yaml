
limits:
  image_max_bytes: 52428800
  video_max_bytes: 209715200
  max_video_duration_seconds: 60
  duration_tolerance_seconds: 0.5
  min_image_side_pixels: 32
  image_max_pixels: 210000000   # 108 / 200 MP phone photos must pass (decided); still stops pixel bombs


allowed_formats:
  image:
    - jpeg
    - png
    - webp
    - heic
  video:
    - mp4
    - mov
    - avi

timeouts:
  ffprobe_seconds: 10
  frame_decode_seconds: 15
  frame_sample_seconds: 60


temp_dir: 'D:\mmp-moderator-poc\data\tmp'



model_version: validation-0.1

intake:
  chunk_size_bytes: 1048576

tools:
  ffprobe: ffprobe
  ffmpeg: ffmpeg

metadata:
  ai_generator_keywords:
    - dall-e
    - "dall·e"
    - midjourney
    - stable diffusion
    - firefly
    - imagen
    - novelai
    - comfyui
    - automatic1111
    - invokeai
    - leonardo
    - ideogram
    - flux
    - sora
    - runway

logging:
  level: INFO

redis:
  url: redis://127.0.0.1:6379/0
  cache_ttl_seconds: 2592000
  lock_ttl_seconds: 60
  lock_wait_seconds: 5
  lock_poll_seconds: 0.2
  connect_timeout_seconds: 2
  socket_timeout_seconds: 2

safety:
  # Step 8b, before any model or person sees the file. placeholder = NOT checked (POC only);
  # hash_list = exact SHA-256 / MD5 match against hash_list_file (from law enforcement /
  # NCMEC hash sharing via trust-and-safety; never in the repo). PhotoDNA / Thorn Safer
  # are added once the company has access. If a real check cannot run, the API answers 503
  # (try again): nothing is moderated unchecked.
  csam_provider: placeholder
  require_real_check: false     # production: true (refuses to start with the placeholder)
  hash_list_file: null
  # A match is moved here with a JSON report record instead of being deleted (evidence for
  # the legal report). Restricted access; never inside the repo.
  quarantine_dir: 'D:\mmp-quarantine'

blocklist:
  # 8 bands of 8 bits: any hash within 7 bits shares at least one band, so 7 is the maximum.
  max_distance: 6
  # Rejections with these codes are added automatically. MOD_008 (bad file) never belongs here.
  auto_block_codes:
    - MOD_004

prepare:
  backbone_size: 384          # SigLIP 2 (long side, aspect ratio kept)
  detector_size: 640          # RF-DETR (long side, aspect ratio kept)
  short_video_seconds: 10     # below this: one frame every short interval
  short_video_interval_seconds: 0.5
  long_video_interval_seconds: 1.0
  last_frame_offset_seconds: 0.1
  max_video_frames: 63
  ffmpeg_hwaccel: none        # "auto" tries Intel Quick Sync / D3D11 video decoding

ml:
  device: cpu        # cpu on this laptop; cuda for the cloud NVIDIA run (Step 16b)
  dtype: float32     # float16 only on cuda (about 2x faster on NVIDIA, tiny accuracy change)
  num_threads: 4     # i5-10210U has 4 cores
  warmup: true       # run one tiny picture through each model at startup
  backbone: siglip2_base   # which SigLIP 2 the server loads; null = none
  detector: owlv2          # Gate 1 animal detector (finds WHERE an animal is); null = off
  species_model: bioclip2  # names the species in each animal box; null = off
  nsfw_model: nsfw_vit     # Gate 2 D2: human nudity on the detector frames; null = off
  ai_model: ai_smaug       # AI-generated label (ai_generated / ai_score); null = metadata only
  ocr: true                # read text on images / video frames (gate2.text.ocr); false = off
  audio_model: ast_audioset   # video sound events (spec 6.2); null = off
  speech_model: whisper_base  # video speech to text (spec 6.2); whisper_small = better Hindi, slower; null = off
  batch_size: 16           # video frames per SigLIP pass
  models:
    siglip2_base:
      repo: google/siglip2-base-patch16-384
      revision: f775b65a79762255128c981547af89addcfe0f88
      licence: Apache-2.0
    siglip2_large:
      repo: google/siglip2-so400m-patch16-384
      revision: dd658faac399427308559e2c3ac1e99cbe43845d
      licence: Apache-2.0
    owlv2:
      repo: google/owlv2-base-patch16-ensemble
      revision: cfd3195ba4ea9592eec887ded089f4c08eff231d
      licence: Apache-2.0
    bioclip2:
      repo: imageomics/bioclip-2
      revision: 2957b322090f9cb17ae72c71981c7218a28d81e0
      licence: MIT
    nsfw_vit:   # ViT-base image classifier, labels normal / nsfw (Gate 2 D2)
      repo: Falconsai/nsfw_image_detection
      revision: 96cb0d0342c7afb80cab76ecc58b265fa44da256
      licence: Apache-2.0
    ast_audioset:   # audio events (527 AudioSet labels: dog whimper, screaming, slap...) - spec 6.2
      repo: MIT/ast-finetuned-audioset-10-10-0.4593
      revision: f826b80d28226b62986cc218e5cec390b1096902
      licence: BSD-3-Clause
    whisper_base:   # speech to text (99 languages incl. Hindi) - spec 6.2 hate speech / verbal abuse
      repo: openai/whisper-base
      revision: e37978b90ca9030d5170a5c07aadb050351a65bb
      licence: Apache-2.0
    whisper_small:  # more accurate on Hindi, about 3x slower on CPU
      repo: openai/whisper-small
      revision: 973afd24965f72e36ca33b3055d56a652f456b4d
      licence: Apache-2.0
    ai_smaug:   # AI-generated label candidate: EmbeddingGemma-2 vision + classifier (repo code)
      repo: abacusai/Smaug-AI-Image-Detector
      revision: c7c95951e04a87b884a4ad479401b1128c3903bd
      licence: Apache-2.0
    ai_swin:    # AI-generated label candidate: Swin v2, labels artificial / real
      repo: haywoodsloan/ai-image-detector-deploy
      revision: 4ae1822603cb1ec980c217cfde1ef1b8e0477a16
      licence: Apache-2.0
  # Step 16 sanity sentences. Step 17 replaces them with the Gate 1 set.
  # They are embedded once at startup; the text half of the model is then deleted.
  prompts:
    animal: "a photo of an animal"
    cat: "a photo of a cat"
    dog: "a photo of a dog"
    food: "a photo of food"
    no_animal: "a photo with no animal in it"

gate1:
  # Bump when the Gate 1 logic changes. model_version = this + model + revision + a
  # fingerprint of every decision-relevant setting, so editing a sentence or a threshold
  # automatically gives a new model_version (and a new cache key).
  version: gate1-fused-0.4   # 0.4: look-alike queries, confident-species bar, marine always review
  # true = act on Gate 1 (MOD_001 rejections). false = shadow mode: compute and flag only,
  # decision stays HUMAN_REVIEW. The POC runs live; production can start in shadow mode.
  enforce: true
  thresholds:
    pass_photo: 75          # spec 2.2
    pass_illustrated: 60    # spec 2.3: drawings / cartoons
    pass_insect: 60         # spec 2.1: "lower threshold" (decided: 60)
    fail_below: 50          # below this: MOD_001
  video_min_pass_fraction: 0.30   # spec 6.1: pet in at least 30% of sampled frames
  score_scale: 1.0                # sharpness of the score; tuned in the evaluation step
  # "{}" is replaced by each animal / no-pet idea; several wordings are averaged.
  templates:
    - "a photo of {}."
    - "a blurry photo of {}."
    - "a dark photo of {}."
    - "a close-up photo of {}."
  # Spec 2.1 categories. "Pest" pets (spec 7) are included on purpose.
  animals:
    dogs: ["a dog", "a puppy", "a stray dog"]
    cats: ["a cat", "a kitten", "a persian cat"]
    birds: ["a parrot", "a budgie", "a lovebird", "a pigeon", "a hen", "a bird in a cage"]
    fish: ["a goldfish", "a betta fish", "a koi fish", "fish in an aquarium", "small fish in a fish tank"]
    other_aquatic: ["a turtle", "a frog", "a crab", "a shrimp", "a snail", "an axolotl"]
    reptiles: ["a lizard", "a gecko", "a snake", "a chameleon", "an iguana"]
    small_mammals: ["a rabbit", "a hamster", "a guinea pig", "a ferret", "a mouse", "a rat", "a small animal held in a person's hands"]
    farm: ["a cow", "a goat", "a sheep", "a horse", "a duck", "a rooster"]
    insects: ["a beetle", "a praying mantis", "a stick insect", "a tarantula", "a scorpion", "a cockroach", "an insect"]
    exotic: ["a deer", "a peacock", "a monkey"]
    marine_mammals: ["a dolphin", "a whale"]
  insect_categories: [insects]                        # use pass_insect
  wild_check_categories: [exotic, marine_mammals]     # decided: no owner context -> HUMAN_REVIEW
  always_review_categories: [marine_mammals]         # decided: never pets (spec 2.1) -> always HUMAN_REVIEW
  # Plain non-pet scenes only. Pet accessories (cage, tank, bowl, collar, bed, leash) are left
  # out on purpose: they appear IN most pet photos, and SigLIP cannot tell "an empty cage" from
  # "a cage with birds", which rejected real pets (budgies, goldfish, puppy + kitten).
  # Accessory-only photos (spec 2.3) are left to the trained Gate 1 classifier (next step).
  no_pet:
    - "a person"
    - "a room interior"
    - "a landscape"
    - "food on a plate"
    - "a car"
    - "a building"
    - "furniture"
    - "a screenshot of text"
  # Full sentences (no template): which threshold applies, and wild context.
  photo: ["a photograph.", "a real photo taken with a phone camera."]
  illustration: ["a cartoon drawing.", "a digital illustration.", "a painting.", "a 3D render.", "anime artwork.", "a pencil sketch."]
  wild: ["a wild animal in nature.", "an animal swimming in the open ocean.", "a wild animal in a forest.", "wildlife photography."]
  domestic: ["a pet at home.", "an animal with its owner.", "an animal inside a house.", "an animal in a zoo, sanctuary or rescue centre."]
  # Detector (OWLv2): its best animal-box score becomes 0-100 between these two values.
  # Tested on 30 photos: real animals 0.55-0.96, accessory-only photos 0.00-0.19.
  detector:
    score_floor: 0.1        # box score that counts as 0
    score_full: 0.5         # box score that counts as 100
    min_box_score: 0.3      # boxes good enough to name a species
    max_species_boxes: 3    # spec 2.3: several animals -> several species
    # Not animals, but animal-SHAPED (hard-case test 2026-10-21). OWLv2 also looks for these; a box
    # whose best name is one of them does not count as an animal.
    lookalikes:
      - ceramic figurine
      - statue
      - sculpture
      - stuffed toy
      - plush toy
      - person in an animal costume
      - sticker
      - fur coat
      - printed pattern on fabric
      - wooden driftwood
      - paper cut-out
    video_frames: 8         # video: frames checked by the detector (incl. first / middle / last)
  # pet_score = detector_weight x detector score + siglip_weight x SigLIP score (calibrated later).
  fusion:
    detector_weight: 0.7
    siglip_weight: 0.3
  species_min_confidence: 0.3   # below this BioCLIP is unsure: use the detector's name instead
  # BioCLIP must be at least this sure before its species changes the bar (insects 60) or the
  # wild / marine rules; below it SigLIP's view of the picture decides the category.
  species_category_min_confidence: 0.5
  # Names the detector looks for and BioCLIP chooses from -> the spec 2.1 category of each.
  # These names are what the API returns in species_detected.
  species:
    dog: dogs
    cat: cats
    parrot: birds
    budgerigar: birds
    lovebird: birds
    pigeon: birds
    chicken: birds
    cockatiel: birds
    hen: birds
    goldfish: fish
    betta fish: fish
    koi: fish
    guppy: fish
    cichlid: fish
    seahorse: fish
    turtle: other_aquatic
    frog: other_aquatic
    crab: other_aquatic
    shrimp: other_aquatic
    snail: other_aquatic
    axolotl: other_aquatic
    lizard: reptiles
    gecko: reptiles
    snake: reptiles
    chameleon: reptiles
    iguana: reptiles
    bearded dragon: reptiles
    rabbit: small_mammals
    hamster: small_mammals
    guinea pig: small_mammals
    mouse: small_mammals
    rat: small_mammals
    ferret: small_mammals
    squirrel: small_mammals
    cow: farm
    goat: farm
    sheep: farm
    horse: farm
    duck: farm
    rooster: farm
    beetle: insects
    praying mantis: insects
    stick insect: insects
    tarantula: insects
    scorpion: insects
    cockroach: insects
    butterfly: insects
    deer: exotic
    peacock: exotic
    monkey: exotic
    dolphin: marine_mammals
    whale: marine_mammals

ai_label:
  # Not in the spec: our own label (ai_generated / ai_score in the response). It never
  # changes the decision. Metadata first (C2PA / IPTC "trained algorithmic media", Stable
  # Diffusion PNG text, generator names in metadata.ai_generator_keywords) = certain;
  # otherwise ml.ai_model on the original image or a few detector frames of a video.
  version: ai-label-0.2   # 0.2: one crop (T4: Smaug was 545 of ~800 ms per image with 3)
  threshold: 0.9      # model probability from which ai_generated is true (set from the comparison)
  crops: 1            # Smaug: 1 = centre 528 px crop, about 3x faster; 3 = start, centre, end (more accurate)
  video_frames: 3     # detector frames of a video the model looks at (start, middle, end)

targets:   # spec MMP-MOD-2026-001, non-functional requirements
  image_p95_seconds: 3
  video_p95_seconds: 15


gate2:
  # Bump when the Gate 2 logic changes. Part of model_version, like gate1.version.
  version: gate2-0.14  # 0.14: slaughterhouse / carcasses; 0.13: stick abuse + fetch safe sentences; 0.12: video audio (sounds + speech); 0.11: text on images (OCR + word lists); 0.10: nude art; 0.9: swimwear / shirtless with a pet; 0.8: real dog fights; 0.7: nudity sentences; 0.6: suggestive pose + spiked muzzle; 0.5: NSFW on detector frames only; 0.4: D1-D3; 0.3: D4 items; 0.2: D5 + D6
  # true = act on Gate 2 (rejections, reviews, approvals). false = shadow mode: scores are
  # computed, reported and logged, nothing is approved, and a Gate 2 rejection only adds
  # the flag gate2_would_reject.
  enforce: true
  # Approved posts carry the flag d1_d3_zero_shot while the D1-D3 detectors are zero-shot
  # and their recall is unmeasured (decided 2026-10-27). Turn off once trust-and-safety
  # data has measured them.
  flag_zero_shot: true
  weights:            # spec 3.2; must add up to 1
    D1_welfare: 0.25
    D2_nsfw: 0.25
    D3_violence: 0.20
    D4_prohibited: 0.10
    D5_quality: 0.10
    D6_relevance: 0.10
  thresholds:         # spec 3.3: >= approve -> APPROVED, >= review -> HUMAN_REVIEW, else REJECTED
    approve: 80
    review: 55
  # D5 and D6 move the composite by at most 20 points, so on their own they never reject or
  # hold a post (decided 2026-10-23: the scores are reported and used elsewhere).
  # Weighted, one serious signal hardly moves the composite (visible drugs: D4 20 -> composite
  # 92 = APPROVED). Any single signal costing at least this many points (after contexts)
  # goes to a human. Our rule, not in the spec: founder to confirm.
  review_from_deduction: 40
  # spec 6.3: D1-D4 of a video = the worst average over any N consecutive frames
  video_window_frames: 3
  # spec 5.2: exactly one code per rejection; when several apply, the first in this list wins
  code_priority: [MOD_008, MOD_001, MOD_003, MOD_002, MOD_009, MOD_004, MOD_005, MOD_006, MOD_007]
  low_score_code: MOD_007   # composite too low and no safety signal to blame
  # spec 4.1-4.4. Each of D1-D4 starts at 100; deduction = points off (minimum 0).
  # hard: rejected whatever the composite. review: always at least HUMAN_REVIEW.
  signals:
    # D1 animal welfare (4.1)
    welfare_distress:            {dimension: D1_welfare, deduction: 30, code: MOD_002}
    welfare_painful_restraint:   {dimension: D1_welfare, deduction: 40, code: MOD_002}
    welfare_wounds:              {dimension: D1_welfare, deduction: 50, code: MOD_002}
    welfare_malnourished:        {dimension: D1_welfare, deduction: 25, code: MOD_002}
    welfare_fighting:            {dimension: D1_welfare, deduction: 100, code: MOD_003, hard: true}
    welfare_abuse:               {dimension: D1_welfare, deduction: 100, code: MOD_002, hard: true}
    welfare_neglect:             {dimension: D1_welfare, deduction: 30, code: MOD_002}
    welfare_graphic_dead:        {dimension: D1_welfare, deduction: 60, code: MOD_002}
    welfare_killing:             {dimension: D1_welfare, deduction: 100, code: MOD_002, hard: true}
    welfare_trafficking:         {dimension: D1_welfare, deduction: 80, code: MOD_009, hard: true}
    # D2 adult / NSFW (4.2)
    nsfw_partial_nudity:         {dimension: D2_nsfw, deduction: 10, code: MOD_004}
    nsfw_sexual_human:           {dimension: D2_nsfw, deduction: 50, code: MOD_004}
    nsfw_explicit_human:         {dimension: D2_nsfw, deduction: 100, code: MOD_004, hard: true}
    nsfw_animal:                 {dimension: D2_nsfw, deduction: 100, code: MOD_004, hard: true}
    nsfw_suggestive_overlay:     {dimension: D2_nsfw, deduction: 100, code: MOD_004, hard: true}
    nsfw_explicit_text:          {dimension: D2_nsfw, deduction: 40, code: MOD_004}
    # D3 violence and gore (4.3)
    violence_minor_blood:        {dimension: D3_violence, deduction: 15, code: MOD_005}
    violence_animal_gore:        {dimension: D3_violence, deduction: 60, code: MOD_005}
    violence_human_gore:         {dimension: D3_violence, deduction: 50, code: MOD_005}
    violence_weapon_pointed:     {dimension: D3_violence, deduction: 70, code: MOD_005}
    violence_animal_fighting:    {dimension: D3_violence, deduction: 100, code: MOD_003, hard: true}
    violence_human_on_animal:    {dimension: D3_violence, deduction: 100, code: MOD_002, hard: true}
    violence_slaughter:          {dimension: D3_violence, deduction: 80, code: MOD_005, hard: true}
    # D4 prohibited items (4.4)
    item_firearm:                {dimension: D4_prohibited, deduction: 60, code: MOD_006}
    item_drugs:                  {dimension: D4_prohibited, deduction: 80, code: MOD_006}
    # spec: "-100 + D1 deduct"; drugging an animal is abuse, so D1 loses everything too
    item_drug_use_on_animal:     {dimension: D4_prohibited, deduction: 100, code: MOD_006, hard: true,
                                  also_deduct: {D1_welfare: 100}}
    item_weapon_knife:           {dimension: D4_prohibited, deduction: 40, code: MOD_006}
    item_alcohol:                {dimension: D4_prohibited, deduction: 10, code: MOD_006}
    item_tobacco:                {dimension: D4_prohibited, deduction: 10, code: MOD_006}
    # Audio of a video (6.2): "deduct 20 from D1", "audio-only issues do not trigger hard reject"
    audio_distress:              {dimension: D1_welfare, deduction: 20, code: MOD_002}
    audio_violence:              {dimension: D1_welfare, deduction: 20, code: MOD_002}
    audio_abusive_speech:        {dimension: D1_welfare, deduction: 20, code: MOD_002}
  # spec 7 (and the 4.4 hunting exception). A context changes non-hard signals only:
  # a hard reject is never softened. When two contexts set the same signal, the lower wins.
  contexts:
    medical:               # e-collar, stitches, clean bandages: treatment, not abuse
      deductions: {welfare_wounds: 0}
    rescue:                # injured stray being helped: D1 deductions halved
      dimension_factor: {D1_welfare: 0.5}
    raw_feeding:           # prey-model diet: -10 to -25 for blood, a human checks heavy blood
      deductions: {violence_minor_blood: 10, violence_animal_gore: 25}
      review_on: [violence_animal_gore]
    peaceful_memorial:     # peaceful deceased pet: no welfare deduction for the pose itself
      deductions: {welfare_graphic_dead: 0, welfare_distress: 0}
    hunting:               # firearm in a hunting scene goes to a human
      review_on: [item_firearm]
  # D5 image quality (spec 4.5), app/gates/quality.py. Measured on the detector-size
  # picture (long side 640); sharpness on Gate 1's pet box when there is one. The worst
  # problem found decides the score. Tuned with scripts/make_quality_set.py + bench_quality.py.
  quality:
    bands:                     # spec 4.5 score ranges
      sharp: [80, 100]
      slight_blur: [55, 75]
      heavy_blur: [10, 30]
      dark: [40, 60]           # also used for burnt-out (overexposed) pictures
      screenshot: [30, 50]     # low resolution or a letterboxed video screenshot
      compressed: [20, 40]
    blank_max_contrast: 4      # brightness std below this = solid colour frame -> 0
    sharpness:                 # Laplacian variance at mid-grey brightness (quality set, 2026-10-27:
      heavy_below: 10          #   heavy blur 0-10, slight blur 3-175, good photos mostly 170-7500)
      slight_below: 130
      full_at: 700
    min_box_side: 48           # pet boxes smaller than this: measure the whole picture
    dark_mean_below: 50        # darkened copies 11-43, darkest good photo 58
    bright_level: 250
    bright_fraction_above: 0.5 # burnt-out copies mostly 0.6-0.9; white studio backgrounds
                               #   reach 0.7 on the whole picture, hence measured on the pet box
    bar_level: 20              # a row / column darker than this and ...
    bar_max_std: 4             # ... this flat counts as a black bar
    bar_min_fraction: 0.08     # bars on both sides covering at least this = letterboxed
    lowres_short_side_below: 480
    jpeg_quality_below: 30
  # D4 prohibited items (spec 4.4), app/gates/items.py. Extra queries in Gate 1's OWLv2 pass
  # (no extra model run): query -> gate2 signal. Every box takes the name it fits best, so
  # the harmless look-alikes (null) catch toy guns and kitchen knives before they count.
  # Drug use on an animal and weapons pointed at someone need the whole scene: step 2e.
  items:
    # OWLv2 box score an item needs to count. 2026-10-27, 93 safe photos (easy set + hard-case
    # pets): highest item scores 0.36 (machete on an old monkey photo), 0.33 (cannabis plant
    # on a snail's leaf), everything else < 0.3. No positive photos measured yet (junior T3).
    min_score: 0.4
    queries:
      gun: item_firearm
      rifle: item_firearm
      pistol: item_firearm
      toy gun: null
      water gun: null
      large knife: item_weapon_knife
      machete: item_weapon_knife
      kitchen knife: null    # spec 4.4: an incidental kitchen knife is ignored
      bong: item_drugs
      marijuana joint: item_drugs   # no "cannabis plant": it fires on ordinary leaves
      beer bottle: item_alcohol
      wine bottle: item_alcohol
      glass of beer: item_alcohol
      cigarette: item_tobacco
      cigar: item_tobacco
      vape: item_tobacco
  # D6 context relevance (spec 4.6), app/gates/relevance.py. SigLIP compares the picture
  # with these sentences; the most likely kind gives the band, and SigLIP's certainty
  # places the score inside it (unsure = bottom of the band).
  relevance:
    kinds:
      personal_moment:
        band: [85, 100]
        sentences:
          - a candid photo of a person with their pet
          - a selfie of a pet owner with their pet
          - a person cuddling their pet
      domestic:
        band: [85, 100]
        sentences:
          - a photo of a pet at home
          - a pet in a garden or backyard
          - a pet on a walk outdoors
          - a pet resting on a bed or sofa
      vet_groomer_shop:
        band: [75, 90]
        sentences:
          - a pet at a veterinary clinic
          - a pet being groomed at a grooming salon
          - animals for sale in a pet shop
      commercial_shoot:
        band: [65, 80]
        sentences:
          - a professional studio photo of a pet on a plain background
          - a stock photo of a pet
          - a product photo of pet food or a pet toy
      meme:
        band: [60, 80]
        sentences:
          - a funny meme of a pet with a text caption
          - an edited humorous picture of a pet
      infographic:
        band: [55, 75]
        sentences:
          - an infographic about pet care with text and icons
          - an educational chart about animals
      advert:
        band: [20, 40]
        sentences:
          - an advertising banner with a small pet logo
          - a promotional flyer with a discount offer
      spam:
        band: [0, 20]
        sentences:
          - an advertisement for something unrelated to animals
          - a screenshot of a spam message
          - a product for sale with a price tag
      political_religious:
        band: [30, 50]
        sentences:
          - a political poster or protest sign
          - religious imagery with a symbol of faith
  # D1 / D3 (and the animal and partial-nudity parts of D2) plus the spec 7 contexts,
  # app/gates/scene.py. Zero-shot: SigLIP's own yes-probability per sentence, from the
  # embedding Gate 1 already made. A harm sentence counts only when it reaches
  # min_probability AND fits the picture better than every safe sentence (the safe list
  # holds the look-alike everyday scenes: play fighting, cones, raw food, carriers...).
  # Checked 2026-10-27 on 257 safe pictures (Gate 1 sets + video frames): highest harm
  # probability with the veto was about 0.02, so 0.2 leaves a wide gap. Recall is NOT
  # measured yet: positives only come through the trust-and-safety process.
  scene:
    min_probability: 0.2
    context_min_probability: 0.1   # cone photos reached 0.6-0.7; safe photos at most 0.02
    safe:
      home: [a photo of a pet relaxing at home, a cute dog or cat indoors]
      play: [two dogs playing together, puppies play fighting, kittens wrestling playfully,
             a dog playing tug of war with a toy, a person throwing a stick for a dog to fetch,
             a dog carrying a stick in its mouth]
      outdoor: [a dog on a walk in the park, a pet outdoors in nature]
      sleep: [a pet sleeping peacefully, a cat curled up asleep]
      care: [a dog wearing a cone collar after surgery, a pet at the vet for a checkup,
             a dog with a bandage on its leg, a pet being groomed, a dog having a bath]
      food: [a dog eating from its food bowl, a dog eating raw meat and bones]
      costume: [a pet wearing a costume, a dog in a sweater]
      people: [a person gently holding a tiny kitten, a hand petting a cat, a person hugging their dog,
               a child playing with a cat, a person holding a pet]
      gear: [a dog resting in its crate, a dog on a leash, a dog wearing a muzzle on a walk]
      babies: [newborn kittens with their eyes closed, a mother cat with her kittens, newborn puppies]
      transport: [a closed pet carrier, a pet in a travel carrier, a pet shop display]
      portrait: [a close-up portrait of a pet, a studio photo of a pet]
      other_animals: [a bird, a fish in an aquarium, a horse in a field, a reptile in a terrarium,
                      a wild animal in nature]
      no_animal: [a landscape, food on a plate, a room with furniture, a person]
    harm:
      distress:
        signals: [welfare_distress]
        sentences: [a frightened animal cowering in fear, an animal in distress]
      restraint:   # spiked muzzle: 0.37 on a missed fetish-style upload (2026-10-27), 0.000 on safe
        signals: [welfare_painful_restraint]
        sentences: [an animal tied up tightly with rope, a dog with its mouth taped shut,
                    a dog in a spiked muzzle and spiked harness]
      wounds:
        signals: [welfare_wounds]
        sentences: [an animal with open bleeding wounds, an injured animal with a deep wound]
      malnourished:
        signals: [welfare_malnourished]
        sentences: [a starving emaciated dog with visible ribs, a very thin malnourished animal]
      fighting:
        signals: [welfare_fighting, violence_animal_fighting]
        # a real fight outside a pit was missed (2026-10-27): the pit sentence lost to the
        # safe "puppies play fighting"; these two gave 0.88 / 0.82 on it, safe pictures <= 0.002
        sentences: [two dogs fighting viciously in a fighting pit, a cockfight,
                    organised animal fighting with people betting, a vicious dog fight,
                    dogs snarling and attacking each other]
      abuse:   # "someone hurting a cat" was too vague: 0.30 on a kitten held in a hand
        signals: [welfare_abuse, violence_human_on_animal]
        # stick abuse missed 2026-10-28 (stock photo, raised stick over a held-down dog):
        # these gave 0.98 / 0.96 / 0.89 on it, safe pictures <= 0.018; fetch is in the safe list
        sentences: [a person kicking a dog, a person beating an animal, a person hitting a cat,
                    a person threatening a dog with a stick, a person beating a dog with a stick,
                    a person raising a stick to hit a dog]
      neglect:
        signals: [welfare_neglect]
        sentences: [a dirty neglected dog chained in filth, an animal locked in a filthy cage]
      dead:
        signals: [welfare_graphic_dead]
        sentences: [a dead animal lying on the road, an animal carcass]
      slaughter:
        signals: [welfare_killing, violence_slaughter]
        # a slaughterhouse full of hanging carcasses was approved (2026-10-28): the last three
        # gave 0.71 / 0.39 / 0.32 on it, safe pictures <= 0.003
        sentences: [an animal being slaughtered, killing an animal,
                    a meat processing plant with animal carcasses, a slaughterhouse, an abattoir]
      trafficking:
        signals: [welfare_trafficking]
        sentences: [many puppies crammed into small cages for sale, exotic animals smuggled in boxes]
      gore:
        signals: [violence_animal_gore]
        sentences: [a gory bloody animal carcass, animal intestines and blood]
      human_gore:
        signals: [violence_human_gore]
        sentences: [a bloody injured person, human gore]
      minor_blood:
        signals: [violence_minor_blood]
        sentences: ["a small amount of blood on an animal's fur", a pet with a little blood on it]
      weapon_pointed:
        signals: [violence_weapon_pointed]
        sentences: [a person pointing a gun at an animal, "a knife held to an animal's throat"]
      drug_use:
        signals: [item_drug_use_on_animal]
        sentences: ["a person blowing smoke into a dog's face", an animal being given drugs]
      nsfw_animal:
        signals: [nsfw_animal]
        sentences: [sexual content involving an animal]
      # A sexualised pose with an animal but no nudity: the NSFW model gave 0.005 and the
      # lingerie / "suggestive" sentences ~0.0002 on the missed upload; this one gave 0.87
      # (safe pictures at most 0.025). "fetish photo shoot" was dropped: 0.75 on an empty dog bed.
      suggestive:
        signals: [nsfw_sexual_human]
        sentences: [a glamour model posing with a dog]
      # Full non-sexual nudity (not in the spec's list): a human decides. The NSFW model
      # missed it (0.000 on the frame, 0.02 on a person crop: trained on sexual content).
      # Missed upload 2026-10-27: 0.87 / 0.68 / 0.52; safe pictures at most 0.10 / 0.04 / 0.001.
      nudity:
        signals: [nsfw_sexual_human]
        # nude art (a painting was approved): 0.998 / 0.54 / 0.32 on it, safe pictures <= 0.012
        sentences: [a naked person with a pet, a nude person with an animal, a fully nude person outdoors,
                    a painting of a nude woman with a dog, a painting of a naked person with an animal,
                    an artwork showing a naked woman]
      partial_nudity:   # -10, approved with a flag. "... with a dog/pet" added 2026-10-27: SigLIP
        # gave 0.00-0.03 for plain "bikini" / "shirtless" on two beach and street uploads, 0.43-0.93
        # with the pet in the sentence; safe pictures at most 0.005.
        signals: [nsfw_partial_nudity]
        sentences: [a person in a bikini or swimwear, a shirtless man, a person in a bikini with a dog,
                    a woman in swimwear with a pet, a shirtless person with a pet]
    contexts:
      medical: [a dog wearing a cone collar, a pet with a bandage at the vet, a pet with stitches after surgery]
      rescue: [an injured stray animal being rescued, a rescuer helping a hurt animal]
      raw_feeding: [a dog eating raw meat, a raw food diet for a dog with raw chicken]
      peaceful_memorial: [a memorial photo of a pet that passed away, a deceased pet resting peacefully with flowers]
      hunting: [a hunting dog with a hunter in the field, a hunter with a rifle and his dog]
  # D2 human nudity: ml.nsfw_model (normal / nsfw) on the frames the detector looked at
  # (all 8 on a video; decided 2026-10-27: ~2 s instead of ~13 s on CPU, a short moment
  # between those frames can be missed). On 189 safe photos
  # its highest nsfw probability was 0.14 (a balloon dog). Not in the list = below every level.
  nsfw:
    label: nsfw
    levels:
      nsfw_explicit_human: 0.95   # hard reject
      nsfw_sexual_human: 0.8      # -50: a human checks it (review_from_deduction)
  # Spec 4.2 "text overlay with explicit sexual language" (-40, so a human checks it) and
  # section 7 (memes are fine unless the text itself violates). app/gates/text.py: whole
  # words / phrases from the lists, minus the pet-platform allow list. The same lists check
  # speech in video audio. See config/text/README.md for sources and licences.
  text:
    signal: nsfw_explicit_text
    blocklists: [config/text/ldnoobw_en.txt, config/text/ldnoobw_hi.txt, config/text/extra_hi_devanagari.txt]
    allow: [config/text/allow_pet_words.txt]
    ocr:   # EasyOCR (Apache-2.0); weights from scripts.download_models, never at request time
      languages: [en, hi]
      model_dir: 'D:\easyocr-models'
      min_confidence: 0.4
      video_frames: 3      # detector frames of a video that are read (start, middle, end)
  # Spec 6.2: the audio track of a video (app/gates/audio.py). Sounds from ml.audio_model
  # (AudioSet labels, highest score in any chunk); speech from ml.speech_model, checked with
  # the text word lists above. Videos without audio, and images, skip this.
  audio:
    sample_rate: 16000
    chunk_seconds: 10
    sounds:
      audio_distress:    # animal distress: yelping, whimpering, screaming, caterwauling
        labels: ["Whimper (dog)", "Whimper", "Caterwaul", "Screaming", "Squeal", "Crying, sobbing"]
        min_score: 0.3
      audio_violence:    # sounds of violence or impact
        labels: ["Slap, smack", "Whack, thwack", "Smash, crash", "Breaking", "Gunshot, gunfire"]
        min_score: 0.3
    speech_signal: audio_abusive_speech
    # Whisper only runs when the sound model hears speech: on music or a test tone it took
    # 60-181 s on the laptop CPU and invented 900-2600 characters of text (2026-10-27).
    speech_label: Speech
    speech_min_score: 0.5
