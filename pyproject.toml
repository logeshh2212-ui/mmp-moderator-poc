[project]
name = "mmp-moderator-poc"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "logeshh2212-ui", email = "logeshh2212@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "easyocr>=1.7.2",
    "fastapi>=0.150.0",
    "filetype>=1.2.0",
    "huggingface-hub>=2.2.0",
    "imagehash>=4.3.2",
    "open-clip-torch==3.3.0",
    "pillow>=13.0.0",
    "pillow-heif>=1.8.1",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "redis>=8.1.0",
    "safetensors>=0.8.0",
    "sentence-transformers>=6.2.0",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "transformers>=5.20.2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "fakeredis>=2.40.0",
    "httpx>=0.28.1",
    "psutil>=7.2.2",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--basetemp=data/pytest-tmp -m 'not models'"
markers = ["models: needs downloaded models; run with: uv run pytest -m models"]


[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
